    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['"Fraunces"', 'serif'],
              sans: ['"Open Sans"', 'sans-serif'],
              handwriting: ['"Architects Daughter"', 'cursive'],
            },
            colors: {
              'base-950': '#0a0a0a',
              'base-900': '#141414',
              'base-800': '#1f1f1f',
              'base-700': '#2e2e2e',
              'base-600': '#404040',
              'text-primary': '#f5f5f5',
              'text-muted': '#a3a3a3',
              'text-subtle': '#737373',

            },

    <style>
      html {
        scroll-behavior: smooth;
      }

      body {
        background-color: #0a0a0a;
        color: #f5f5f5;
        cursor: default;
      }

      /* Custom cursor dot */
      .cursor-dot {
        width: 8px;
        height: 8px;
        background-color: #60a5fa;
        border-radius: 50%;
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        transition: transform 0.1s ease;
      }

      .cursor-dot.hover {
        transform: scale(2);
        background-color: #f59e0b;
      }

      /* Handwritten underline effect */
      .handwritten-underline {
        position: relative;
        display: inline-block;
      }

      .handwritten-underline::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 0;
        width: 100%;
        height: 3px;
        background: currentColor;
        opacity: 0.6;
        transform: rotate(-1deg) scaleX(0.95);
        border-radius: 2px;
      }

      /* Subtle grain texture overlay */
      .grain {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: 0.03;
        z-index: 1000;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      }

      /* Selection styling */
      ::selection {
        background-color: rgba(245, 158, 11, 0.3);
        color: #f5f5f5;
      }

      /* Smooth card hover */
      .card-hover {
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                    box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                    border-color 0.3s ease;
      }

      .card-hover:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      /* Floating animation */
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      .animate-float {
        animation: float 6s ease-in-out infinite;
      }

      /* Rotate wiggle for playful elements */
      @keyframes wiggle {
        0%, 100% { transform: rotate(-2deg); }
        50% { transform: rotate(2deg); }
      }

      .animate-wiggle {
        animation: wiggle 3s ease-in-out infinite;
      }

      /* Number styling */
      .section-num {
        font-family: 'Fraunces', serif;
        font-size: 8rem;
        font-weight: 200;
        line-height: 1;
        color: #1f1f1f;
        user-select: none;
      }

      @media (max-width: 768px) {
        .section-num {
          font-size: 5rem;
        }
      }

      /* Utility for PDF generation */
      .break-inside-avoid {
        page-break-inside: avoid;
        break-inside: avoid;
      }

      @media print {
        @page {
          margin: 1cm;
          size: auto;
        }
        body {
          background-color: white;
          color: black;
        }
        .no-print, nav, .grain, .cursor-dot {
          display: none !important;
        }
      }
    </style>
